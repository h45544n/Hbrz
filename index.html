<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>Portfolio Studio</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;700&family=JetBrains+Mono:wght@400;500&family=Unbounded:wght@600;800&family=Syne:wght@700;800&family=Raleway:wght@700;800&family=Fraunces:wght@700;800&family=Chakra+Petch:wght@700&display=swap">
<style>
/* Layout concept: one file, two modes. A public portfolio (big type, image-led grid) and a studio dashboard (sidebar + panels) that edits it live. */
:root{
  --bg:#f2f3f7; --surface:#ffffff; --surface2:#e9ebf2; --fg:#13151b; --muted:#5a6173; --line:#dcdfe8;
  --accent:#2f5bff; --accent-ink:#ffffff; --accent-soft:color-mix(in srgb,var(--accent) 12%,var(--surface));
  --good:#11805a; --warn:#9a5b00; --bad:#c42b3a;
  --f-display:'Unbounded',system-ui,sans-serif; --f-body:'DM Sans',system-ui,sans-serif; --f-mono:'JetBrains Mono',ui-monospace,monospace;
  --r-card:16px; --aspect:4 / 3; --cols:3;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0c0e13; --surface:#141720; --surface2:#1c2030; --fg:#eceef5; --muted:#9aa2b6; --line:#272c3c;
  --good:#43c79a; --warn:#e0a53a; --bad:#ff6b78; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0c0e13; --surface:#141720; --surface2:#1c2030; --fg:#eceef5; --muted:#9aa2b6; --line:#272c3c;
  --good:#43c79a; --warn:#e0a53a; --bad:#ff6b78; color-scheme:dark}

*{box-sizing:border-box}
body{background:var(--bg);color:var(--fg);font:15px/1.55 var(--f-body);-webkit-font-smoothing:antialiased}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:60;background:var(--bg)}
a{color:inherit}
button{font:inherit;color:inherit;cursor:pointer}
img,video{max-width:100%;display:block}
h1,h2,h3{font-family:var(--f-display);line-height:1.08;margin:0;text-wrap:balance;letter-spacing:-.01em}
p{margin:0}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.wrap{max-width:1240px;margin:0 auto;padding-inline:max(16px,env(safe-area-inset-left,0px)) max(16px,env(safe-area-inset-right,0px))}
.wrap.wide{max-width:1440px}
.ico{flex:none}
.mono{font-family:var(--f-mono)}

/* controls */
.btn{display:inline-flex;align-items:center;gap:8px;border:1px solid var(--line);background:var(--surface);color:var(--fg);padding:9px 14px;border-radius:10px;font-weight:600;font-size:14px;text-decoration:none;line-height:1.2;transition:border-color .15s,filter .15s}
.btn:hover{border-color:color-mix(in srgb,var(--fg) 35%,var(--line))}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.primary:hover{filter:brightness(1.08)}
.btn.sm{padding:6px 10px;font-size:13px;border-radius:8px}
.btn.danger{color:var(--bad)}
.btn.ghost{background:transparent}
.icon-btn{width:36px;height:36px;display:inline-grid;place-items:center;border-radius:10px;border:1px solid var(--line);background:var(--surface)}
.icon-btn.sm{width:30px;height:30px;border-radius:8px}
.in{width:100%;padding:10px 12px;border:1px solid var(--line);border-radius:10px;background:var(--surface);color:var(--fg);font:inherit}
.in:focus{outline:2px solid var(--accent);outline-offset:0;border-color:var(--accent)}
textarea.in{resize:vertical;line-height:1.5}
.in.big{font:700 20px/1.2 var(--f-display);padding:12px 14px}
.fld{display:grid;gap:6px;min-width:0}
.fld>span,.lbl{font:500 11.5px/1 var(--f-mono);text-transform:uppercase;letter-spacing:.07em;color:var(--muted)}
.hint{font-size:12.5px;color:var(--muted)}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.grow{flex:1;min-width:0}
.two{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
@media(max-width:560px){.two{grid-template-columns:1fr}}
.chip{display:inline-flex;align-items:center;gap:6px;padding:5px 11px;border-radius:99px;border:1px solid var(--line);background:var(--surface);font-size:13px;font-weight:500}
button.chip:hover{border-color:var(--fg)}
.chip[aria-pressed="true"]{background:var(--fg);color:var(--bg);border-color:var(--fg)}
.chip .x{border:0;background:none;padding:0;display:inline-grid;place-items:center;color:var(--muted)}
.tags{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:8px}
.pill{font:500 11px/1 var(--f-mono);text-transform:uppercase;letter-spacing:.06em;padding:4px 8px;border-radius:6px;white-space:nowrap}
.pill.pub{background:color-mix(in srgb,var(--good) 16%,transparent);color:var(--good)}
.pill.draft{background:color-mix(in srgb,var(--warn) 16%,transparent);color:var(--warn)}
.pill.sample{background:var(--surface2);color:var(--muted)}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:10px;overflow:hidden;background:var(--surface);flex-wrap:wrap}
.seg button{border:0;background:none;padding:8px 14px;font-weight:600;font-size:13.5px;color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--fg);color:var(--bg)}
.sw{display:inline-flex;align-items:center;gap:10px;font-weight:500;cursor:pointer}
.sw input{width:38px;height:22px;appearance:none;background:var(--surface2);border:1px solid var(--line);border-radius:99px;position:relative;cursor:pointer;transition:background .15s;margin:0}
.sw input::after{content:"";position:absolute;top:2px;left:2px;width:16px;height:16px;border-radius:50%;background:var(--muted);transition:transform .15s,background .15s}
.sw input:checked{background:var(--accent);border-color:var(--accent)}
.sw input:checked::after{transform:translateX(16px);background:var(--accent-ink)}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:18px;min-width:0}
.panel>h2,.panel .ph2{font-size:16px;margin-bottom:14px;display:flex;justify-content:space-between;align-items:center;gap:10px}
.stack{display:grid;gap:14px}

/* public site */
.pubhead{position:sticky;top:env(safe-area-inset-top,0px);z-index:50;background:color-mix(in srgb,var(--bg) 88%,transparent);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border-bottom:1px solid var(--line)}
.bar{display:flex;align-items:center;justify-content:space-between;gap:12px;min-height:60px}
.brand{font:800 17px var(--f-display);text-decoration:none;letter-spacing:-.02em}
.nav{display:flex;align-items:center;gap:6px;flex-wrap:wrap;justify-content:flex-end}
.nl{border:0;background:none;padding:8px 10px;font-weight:600;color:var(--muted);border-radius:8px}
.nl:hover{color:var(--fg)}
.hero{padding-block:52px 28px}
.hero-in{display:grid;grid-template-columns:minmax(0,1.5fr) minmax(0,1fr);gap:40px;align-items:center}
.hero h1{font-size:clamp(32px,6.2vw,76px);font-weight:800;letter-spacing:-.025em;line-height:1.02;overflow-wrap:anywhere}
.eyebrow{font:500 12px/1 var(--f-mono);text-transform:uppercase;letter-spacing:.1em;color:var(--muted);margin-bottom:20px}
.lede{font-size:clamp(18px,2.2vw,24px);line-height:1.4;max-width:34ch;margin-top:22px;color:color-mix(in srgb,var(--fg) 84%,var(--bg))}
.hero-cta{display:flex;gap:10px;flex-wrap:wrap;margin-top:28px}
.avail{display:flex;align-items:center;gap:10px;margin-top:22px;font-weight:500;color:var(--muted)}
.dot{width:9px;height:9px;border-radius:50%;background:var(--good);box-shadow:0 0 0 4px color-mix(in srgb,var(--good) 22%,transparent)}
.hero-pic img{width:100%;aspect-ratio:4/5;object-fit:cover;border-radius:var(--r-card);background:var(--surface2)}
@media(max-width:760px){.hero-in{grid-template-columns:1fr;gap:28px}.hero-pic{max-width:300px}}
.sec{padding-block:44px;scroll-margin-top:72px}
.sec-h{display:flex;justify-content:space-between;align-items:end;gap:16px;flex-wrap:wrap;margin-bottom:24px}
.sec-h h2{font-size:clamp(24px,3.4vw,38px);font-weight:800}
.filters{display:flex;gap:8px;flex-wrap:wrap}
.grid{display:grid;grid-template-columns:repeat(var(--cols),minmax(0,1fr));gap:30px 22px}
@media(max-width:900px){.grid{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media(max-width:560px){.grid{grid-template-columns:minmax(0,1fr)}}
.card{display:block;text-decoration:none;min-width:0}
.thumb{position:relative;aspect-ratio:var(--aspect);border-radius:var(--r-card);overflow:hidden;background:var(--surface2);max-width:100%}
.thumb img{width:100%;height:100%;object-fit:cover;transition:transform .4s}
.card:hover .thumb img{transform:scale(1.045)}
.thumb .badge{position:absolute;left:10px;top:10px;background:var(--bg);color:var(--fg);border-radius:8px;padding:4px 8px;font:500 11px var(--f-mono);display:flex;gap:5px;align-items:center}
.cm{display:flex;justify-content:space-between;gap:12px;padding-top:12px;align-items:baseline}
.cm h3{font:700 17px/1.25 var(--f-body);letter-spacing:0}
.ctags{font-size:13px;color:var(--muted);margin-top:2px}
.stats{display:flex;gap:12px;color:var(--muted);font:500 12px var(--f-mono);white-space:nowrap}
.stats span{display:inline-flex;align-items:center;gap:4px}
.empty{padding:40px 20px;border:1px dashed var(--line);border-radius:14px;text-align:center;color:var(--muted)}
.about{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:48px}
@media(max-width:800px){.about{grid-template-columns:1fr;gap:32px}}
.prose p+p{margin-top:1em}
.prose{font-size:18px;line-height:1.65;max-width:62ch}
.skills{display:flex;gap:8px;flex-wrap:wrap}
.xp{display:grid;gap:0;padding:0;margin:0}
.xp>li{list-style:none;display:grid;grid-template-columns:130px minmax(0,1fr);gap:16px;padding:16px 0;border-top:1px solid var(--line)}
.xp>li:last-child{border-bottom:1px solid var(--line)}
.bul{margin:8px 0 0;padding-left:18px;font-size:14.5px;line-height:1.5;color:var(--muted);display:grid;gap:4px}
.xpw+.xpw{margin-top:36px}
.xpw>.lbl{display:block;margin-bottom:14px}
.sgs{display:grid;gap:22px;margin-top:30px}
.sg .skills{margin-top:10px}
.xps{max-height:min(460px,70vh);overflow-y:auto;overscroll-behavior:contain;padding-right:10px;margin-right:-4px;scrollbar-width:thin;scrollbar-color:var(--muted) var(--surface2);border-bottom:1px solid var(--line)}
.xps::-webkit-scrollbar{width:8px}
.xps::-webkit-scrollbar-track{background:var(--surface2);border-radius:99px}
.xps::-webkit-scrollbar-thumb{background:var(--muted);border-radius:99px}
.xps>li:last-child{border-bottom:0}
.xp .per{font:500 12px var(--f-mono);color:var(--muted);padding-top:3px}
.xp b{font-weight:700}
@media(max-width:480px){.xp>li{grid-template-columns:1fr;gap:4px}}
.contact-mail{font:700 clamp(18px,3.6vw,42px)/1.2 var(--f-display);letter-spacing:-.02em;overflow-wrap:anywhere}
.phone{font:500 18px var(--f-mono);margin-top:14px;color:var(--muted)}
.links{display:flex;gap:10px;flex-wrap:wrap;margin-top:22px}
.foot{padding-block:28px 48px;border-top:1px solid var(--line);color:var(--muted);font-size:13.5px;display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap}

/* project page */
.work{padding-block:28px 64px}
.work-in{max-width:980px;margin:0 auto}
.back{display:inline-flex;gap:8px;align-items:center;text-decoration:none;font-weight:600;color:var(--muted);margin-bottom:22px}
.back:hover{color:var(--fg)}
.work h1{font-size:clamp(28px,4.8vw,54px);font-weight:800;letter-spacing:-.02em;line-height:1.1}
.work .desc{font-size:19px;line-height:1.55;max-width:60ch;margin-top:18px;color:color-mix(in srgb,var(--fg) 85%,var(--bg))}
.facts{display:flex;gap:28px;flex-wrap:wrap;margin-top:26px;padding-block:16px;border-block:1px solid var(--line)}
.facts div{display:grid;gap:4px;min-width:0}
.facts dt{font:500 11px var(--f-mono);text-transform:uppercase;letter-spacing:.08em;color:var(--muted)}
.facts dd{margin:0;font-weight:600;overflow-wrap:anywhere}
.facts{margin-bottom:0}
.blk{margin-block:30px}
.blk img,.blk video{width:100%;height:auto;border-radius:calc(var(--r-card) * .6);background:var(--surface2)}
.blk img{cursor:zoom-in}
.blk.inset{max-width:720px;margin-inline:auto}
.blk figcaption{font-size:13.5px;color:var(--muted);margin-top:8px}
.blk-text{max-width:680px;margin-inline:auto;font-size:18px;line-height:1.7}
.blk-text p+p{margin-top:1em}
.blk-h{max-width:680px;margin-inline:auto;font-size:clamp(20px,2.8vw,28px);font-weight:800}
.vid{position:relative;aspect-ratio:16/9;border-radius:calc(var(--r-card) * .6);overflow:hidden;background:var(--surface2)}
.vid iframe{position:absolute;inset:0;width:100%;height:100%;border:0}
.lcard{display:flex;justify-content:space-between;align-items:center;gap:14px;padding:16px 18px;border:1px solid var(--line);border-radius:12px;background:var(--surface);text-decoration:none;max-width:680px;margin-inline:auto}
.lcard:hover{border-color:var(--accent)}
.lcard b{display:block}
.lcard small{color:var(--muted);overflow-wrap:anywhere}
.blk hr{border:0;border-top:1px solid var(--line);max-width:680px}
.appr{display:flex;flex-direction:column;align-items:center;gap:10px;margin-top:56px;padding-block:32px;border-block:1px solid var(--line);text-align:center}
.heart{display:inline-flex;align-items:center;gap:10px;padding:12px 22px;border-radius:99px;border:1px solid var(--line);background:var(--surface);font-weight:700}
.heart[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.heart[aria-pressed="true"] svg{fill:currentColor}
.pn{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px;margin-top:32px}
.pn a{text-decoration:none;border:1px solid var(--line);border-radius:12px;padding:14px 16px;background:var(--surface);display:grid;gap:4px;min-width:0}
.pn a:hover{border-color:var(--accent)}
.pn small{font:500 11px var(--f-mono);text-transform:uppercase;letter-spacing:.07em;color:var(--muted)}
.pn b{overflow-wrap:anywhere}
.pn a:last-child{text-align:right}
.banner{border:1px solid var(--line);background:var(--surface2);border-radius:12px;padding:12px 16px;display:flex;gap:12px;justify-content:space-between;align-items:center;flex-wrap:wrap;margin-bottom:20px}

/* dashboard */
.dtop{position:sticky;top:env(safe-area-inset-top,0px);z-index:50;background:color-mix(in srgb,var(--bg) 90%,transparent);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border-bottom:1px solid var(--line)}
.dash{display:grid;grid-template-columns:224px minmax(0,1fr);gap:28px;padding-block:22px 64px;align-items:start}
.side{position:sticky;top:calc(env(safe-area-inset-top,0px) + 76px);display:grid;gap:18px}
.snav{display:grid;gap:2px}
.snav a{display:flex;gap:10px;align-items:center;padding:9px 12px;border-radius:10px;text-decoration:none;font-weight:600;color:var(--muted)}
.snav a:hover{background:var(--surface2);color:var(--fg)}
.snav a[aria-current="page"]{background:var(--accent-soft);color:var(--fg)}
.me{display:flex;align-items:center;gap:10px;min-width:0}
.me img{width:38px;height:38px;border-radius:50%;object-fit:cover;background:var(--surface2)}
.me b,.me small{display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.me small{color:var(--muted);font-size:12px}
@media(max-width:900px){.dash{grid-template-columns:minmax(0,1fr);gap:16px}.side{position:static}.snav{display:flex;overflow-x:auto;gap:6px;padding-bottom:4px}.snav a{white-space:nowrap}.me{display:none}}
.main{min-width:0;display:grid;gap:20px}
.ph{display:flex;justify-content:space-between;align-items:end;gap:14px;flex-wrap:wrap}
.ph h1{font-size:clamp(24px,3.4vw,34px);font-weight:800}
.ph p{color:var(--muted);margin-top:6px}
.tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:14px}
.tile{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:16px;display:grid;gap:10px}
.tile .lbl{display:flex;align-items:center;gap:8px}
.tile .n{font:700 30px/1 var(--f-display);font-variant-numeric:tabular-nums}
.cols2{display:grid;grid-template-columns:minmax(0,1.6fr) minmax(0,1fr);gap:20px;align-items:start}
@media(max-width:1000px){.cols2{grid-template-columns:minmax(0,1fr)}}
.cv{width:100%;height:auto;display:block}
.cv text{fill:var(--muted);font:11px var(--f-mono)}
.cv .grid{stroke:var(--line);stroke-width:1}
.cv .bar{fill:var(--accent)}
.cv .bar.old{opacity:.5}
.cv .hit{fill:transparent}
.cv .hit:hover{fill:var(--accent-soft)}
.tbl{width:100%;border-collapse:collapse;font-variant-numeric:tabular-nums}
.tbl th,.tbl td{padding:8px 10px;text-align:left;border-bottom:1px solid var(--line);font-size:14px}
.tbl th{font:500 11px var(--f-mono);text-transform:uppercase;color:var(--muted);letter-spacing:.07em}
.scrollx{overflow-x:auto}
.rank{display:grid;gap:12px;margin:0;padding:0;list-style:none}
.rank li{display:grid;grid-template-columns:44px minmax(0,1fr) auto;gap:12px;align-items:center}
.rank img{width:44px;height:34px;border-radius:6px;object-fit:cover;background:var(--surface2)}
.rank b{display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.meter{height:4px;border-radius:99px;background:var(--surface2);margin-top:5px;overflow:hidden}
.meter i{display:block;height:100%;background:var(--accent);border-radius:99px}
.cl{list-style:none;margin:0;padding:0;display:grid;gap:10px}
.cl li{display:flex;gap:10px;align-items:center}
.cl .ck{width:20px;height:20px;border-radius:50%;border:1.5px solid var(--line);display:inline-grid;place-items:center;flex:none}
.cl .done .ck{background:var(--good);border-color:var(--good);color:#fff}
.cl .done span:last-child{color:var(--muted);text-decoration:line-through}
.tools{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.pgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:16px}
.pc{background:var(--surface);border:1px solid var(--line);border-radius:14px;overflow:hidden;display:grid;grid-template-rows:auto 1fr;min-width:0}
.pc .pt{aspect-ratio:16/10;background:var(--surface2);display:block}
.pc .pt img{width:100%;height:100%;object-fit:cover}
.pb{padding:14px;display:grid;gap:10px;align-content:start}
.pb h3{font:700 16px/1.25 var(--f-body);letter-spacing:0;overflow-wrap:anywhere}
.pacts{display:flex;gap:6px;flex-wrap:wrap}
.newc{display:grid;place-items:center;gap:8px;min-height:200px;border:2px dashed var(--line);border-radius:14px;background:none;color:var(--muted);font-weight:600;text-decoration:none}
.newc:hover{border-color:var(--accent);color:var(--fg)}
.ed{display:grid;grid-template-columns:minmax(0,1fr) 320px;gap:20px;align-items:start}
@media(max-width:1000px){.ed{grid-template-columns:minmax(0,1fr)}}
.edside{position:sticky;top:calc(env(safe-area-inset-top,0px) + 76px);display:grid;gap:16px}
@media(max-width:1000px){.edside{position:static}}
.blkc{border:1px solid var(--line);border-radius:12px;background:var(--surface);overflow:hidden}
.bhead{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:6px 8px 6px 14px;border-bottom:1px solid var(--line);background:var(--surface2)}
.btype{display:flex;gap:8px;align-items:center;font:500 12px var(--f-mono);text-transform:uppercase;letter-spacing:.07em;color:var(--muted)}
.bbody{padding:14px;display:grid;gap:12px}
.bprev{border-radius:10px;overflow:hidden;background:var(--surface2)}
.bprev img,.bprev video{width:100%;max-height:340px;object-fit:contain;margin:0 auto}
.bprev .vid{border-radius:0}
.mempty{display:grid;gap:10px;padding:18px;border:1px dashed var(--line);border-radius:10px;justify-items:start}
.addbar{display:flex;gap:8px;flex-wrap:wrap}
.drop{border:2px dashed var(--line);border-radius:14px;padding:22px;text-align:center;color:var(--muted);display:grid;gap:10px;justify-items:center}
.drop.over{border-color:var(--accent);background:var(--accent-soft);color:var(--fg)}
.cover-prev{aspect-ratio:4/3;border-radius:10px;overflow:hidden;background:var(--surface2);display:grid;place-items:center;color:var(--muted);font-size:13px}
.cover-prev img{width:100%;height:100%;object-fit:cover}
.avatar-prev{width:96px;height:96px;border-radius:50%;object-fit:cover;background:var(--surface2)}
.listrow{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.4fr) auto;gap:10px;align-items:start}
.exprow{display:grid;gap:10px;padding:14px;border:1px solid var(--line);border-radius:12px}
@media(max-width:560px){.listrow{grid-template-columns:minmax(0,1fr)}}
.swatches{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.swatch{width:34px;height:34px;border-radius:50%;border:2px solid var(--surface);box-shadow:0 0 0 1px var(--line);padding:0;display:inline-grid;place-items:center;color:#fff}
.swatch[aria-pressed="true"]{box-shadow:0 0 0 2px var(--fg)}
input[type="color"]{width:44px;height:34px;padding:2px;border:1px solid var(--line);border-radius:8px;background:var(--surface)}
.mini{display:grid;grid-template-columns:repeat(var(--cols),minmax(0,1fr));gap:10px}
.mini div{aspect-ratio:var(--aspect);border-radius:var(--r-card);background:linear-gradient(135deg,var(--accent),color-mix(in srgb,var(--accent) 40%,var(--surface2)))}
.mini div:nth-child(2n){background:var(--surface2)}
.pre{width:100%;min-height:110px;font:12.5px/1.5 var(--f-mono)}

.fonts{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:10px}
.fontbtn{border:1px solid var(--line);background:var(--surface);border-radius:12px;padding:14px;text-align:left;display:grid;gap:8px}
.fontbtn:hover{border-color:var(--fg)}
.fontbtn span{font-size:30px;font-weight:800;line-height:1}
.fontbtn small{color:var(--muted);font:500 12px var(--f-body)}
.fontbtn[aria-pressed="true"]{border-color:var(--fg);box-shadow:0 0 0 1px var(--fg)}

/* overlays */
.modal{position:fixed;inset:0;z-index:100;display:grid;place-items:center;background:rgba(10,12,18,.55);padding:16px}
.mbox{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:22px;max-width:420px;width:100%;display:grid;gap:16px}
.mbox h2{font-size:19px}
.lb{position:fixed;inset:0;z-index:110;background:rgba(5,6,10,.93);display:grid;place-items:center;padding:16px;cursor:zoom-out}
.lb img{max-width:100%;max-height:92vh;object-fit:contain;border-radius:8px}
#toast{position:fixed;left:0;right:0;bottom:calc(20px + env(safe-area-inset-bottom,0px));z-index:120;display:grid;gap:8px;justify-items:center;pointer-events:none;padding-inline:16px}
.t{background:var(--fg);color:var(--bg);padding:10px 16px;border-radius:10px;font-weight:600;font-size:14px;max-width:min(92vw,460px)}
.tip{position:fixed;z-index:90;pointer-events:none;background:var(--fg);color:var(--bg);font:500 12px var(--f-mono);padding:6px 9px;border-radius:7px;white-space:nowrap}
@media(prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}

function msrc(ref){
  ref=ref||'';
  if(ref.indexOf('idb:')===0){var u=media.urls[ref.slice(4)];return u?'src="'+esc(u)+'" data-ref="'+esc(ref)+'"':'data-ref="'+esc(ref)+'"'}
  if(ref.indexOf('data:')===0&&ref.length>30000&&ref.indexOf('data:image/svg')!==0){var k=memKey(ref);return 'data-ref="mem:'+k+'"'}
  return ref?'src="'+esc(ref)+'"':'';
}
var memRefs={},memUrls={},memN=0;
function memKey(ref){for(var k in memRefs){if(memRefs[k]===ref)return k}var id='m'+(++memN);memRefs[id]=ref;return id}
function hydrate(root){$$('[data-ref]',root).forEach(function(el){media.url(el.getAttribute('data-ref')).then(function(u){if(u&&el.getAttribute('src')!==u)el.setAttribute('src',u)})})}
/* move large inline images into IndexedDB before saving, so localStorage stays small */
function migrate(){
  var jobs=[];
  function mv(o,k){var v=o[k];if(typeof v==='string'&&v.indexOf('data:')===0&&v.length>120000&&v.indexOf('data:image/svg')!==0){jobs.push(media.put(dataToBlob(v)).then(function(r){o[k]=r}).catch(function(){}))}}
  mv(S.profile,'avatar');S.projects.forEach(function(p){mv(p,'cover');p.blocks.forEach(function(b){mv(b,'src')})});
  return Promise.all(jobs);
}

function save(){
  S.edited=true;saveMsg='Saving...';paintSave();
  clearTimeout(saveTimer);
  saveTimer=setTimeout(function(){
    migrate().then(function(){
      S.saved=Date.now();
      var ok=tset(KEY,JSON.stringify(S));
      saveMsg=ok?'Saved to this browser':'Not saved. Storage is full, export your site.';
      paintSave();
      if(!ok)toast('Browser storage is full. Use Data, then Download site, to keep your work.');
    });
  },350);
}
function paintSave(){$$('.savestate').forEach(function(e){e.textContent=saveMsg})}
function saveStats(){tset(KEY+'-stats',JSON.stringify(T));tset(KEY+'-liked',JSON.stringify(liked))}

/* ---------- helpers ---------- */
function proj(id){return S.projects.filter(function(p){return p.id===id})[0]}
function blk(pid,bid){var p=proj(pid);return p?p.blocks.filter(function(b){return b.id===bid})[0]:null}
var vw=function(p){return (p.views||0)+(T.pv[p.id]||0)};
var lk=function(p){return Math.max(0,(p.likes||0)+(T.pl[p.id]||0))};
function pubProjects(){return S.projects.filter(function(p){return p.status==='published'}).sort(function(a,b){return (b.featured?1:0)-(a.featured?1:0)||b.created-a.created})}
function safeUrl(x){x=String(x||'').trim();if(!x)return '';if(!/^[a-z][a-z0-9+.-]*:/i.test(x)){if(x.indexOf('.')<0||/\s/.test(x))return '';x='https://'+x}try{var u=new URL(x);return /^https?:$/.test(u.protocol)?u.href:''}catch(e){return ''}}
function hostOf(u){try{return new URL(u).host.replace(/^www\./,'')}catch(e){return u}}
function para(t){return String(t||'').trim()?esc(t).split(/\n{2,}/).map(function(x){return '<p>'+x.replace(/\n/g,'<br>')+'</p>'}).join(''):''}
function embedOf(url){
  var m;
  if((m=/(?:youtube\.com\/watch\?[^#]*v=|youtu\.be\/|youtube\.com\/embed\/|youtube\.com\/shorts\/)([\w-]{6,})/.exec(url)))return 'https://www.youtube-nocookie.com/embed/'+m[1];
  if((m=/vimeo\.com\/(?:video\/)?(\d+)/.exec(url)))return 'https://player.vimeo.com/video/'+m[1];
  return '';
}
function isDark(){var t=document.documentElement.getAttribute('data-theme');return t?t==='dark':window.matchMedia('(prefers-color-scheme: dark)').matches}
function inkFor(hex){var m=/^#?([0-9a-f]{6})$/i.exec(hex||'');if(!m)return '#ffffff';var n=parseInt(m[1],16),l=.299*(n>>16)+.587*(n>>8&255)+.114*(n&255);return l>165?'#111111':'#ffffff'}
var themeSet=false;
function applyLook(){
  var L=S.look,root=document.documentElement;
  root.style.setProperty('--accent',L.accent);root.style.setProperty('--accent-ink',inkFor(L.accent));
  root.style.setProperty('--cols',L.cols);root.style.setProperty('--aspect',L.aspect);
  root.style.setProperty('--r-card',L.card==='sharp'?'2px':'16px');
  var ff=FONTS.filter(function(f){return f[0]===L.headFont})[0]||FONTS[0];root.style.setProperty('--f-display',ff[2]);
  if(L.theme==='system'){if(themeSet){root.removeAttribute('data-theme');themeSet=false}}
  else{root.setAttribute('data-theme',L.theme);themeSet=true}
}
function toast(msg){var t=document.createElement('div');t.className='t';t.textContent=msg;$('#toast').appendChild(t);setTimeout(function(){t.remove()},3200)}
function copyText(txt,ok){
  var done=function(){toast(ok||'Copied')},fail=function(){toast('Copy was blocked. Select the text and copy it yourself.')};
  try{navigator.clipboard.writeText(txt).then(done,fail)}catch(e){fail()}
}
function saveFile(name,text,type){
  var b=new Blob([text],{type:type}),a=document.createElement('a');
  a.href=URL.createObjectURL(b);a.download=name;document.body.appendChild(a);a.click();a.remove();
  setTimeout(function(){URL.revokeObjectURL(a.href)},4000);
  toast('Download requested. If nothing downloads, open this page in its own tab.');
}

function ctl(o){
  var idn='c-'+o.scope+'-'+o.f+'-'+(o.id||'')+'-'+(o.sub!==undefined?o.sub:'');
  var a='id="'+idn+'" data-scope="'+o.scope+'" data-f="'+o.f+'"'+(o.id?' data-id="'+o.id+'"':'')+(o.sub!==undefined?' data-sub="'+o.sub+'"':'')+(o.re?' data-re="1"':'')+(o.num?' data-num="1"':'')+(o.ph?' placeholder="'+esc(o.ph)+'"':'');
  if(o.tag==='textarea')return '<textarea class="in '+(o.cls||'')+'" rows="'+(o.rows||4)+'" '+a+'>'+esc(o.val)+'</textarea>';
  if(o.tag==='select')return '<select class="in" '+a+'>'+o.opts.map(function(p){return '<option value="'+esc(p[0])+'"'+(String(p[0])===String(o.val)?' selected':'')+'>'+esc(p[1])+'</option>'}).join('')+'</select>';
  if(o.type==='checkbox')return '<input type="checkbox" '+a+(o.val?' checked':'')+'>';

function applyField(t){
  var d=t.dataset,v=t.type==='checkbox'?t.checked:(d.num?Number(t.value):t.value),sc=d.scope;
  if(sc==='profile'){S.profile[d.f]=v;if(d.f==='name')document.title=(v||'Portfolio')+' | Portfolio'}
  else if(sc==='look'){S.look[d.f]=v;applyLook()}
  else if(sc==='project'){var p=proj(d.id);if(p){p[d.f]=v;p.updated=Date.now()}}
  else if(sc==='block'){var b=blk(d.id,d.sub);if(b)b[d.f]=v}
  else if(sc==='link'){S.profile.links[+d.sub][d.f]=v}
  else if(sc==='exp'){S.profile.experience[+d.sub][d.f]=v}
  else if(sc==='edu'){S.profile.education[+d.sub][d.f]=v}
  else if(sc==='sg'){S.profile.skillGroups[+d.sub][d.f]=v}
  save();
}

function nice(n){var s=Math.pow(10,Math.floor(Math.log10(n))),c=[1,2,3,4,5,6,8,10];for(var i=0;i<c.length;i++){if(c[i]*s>=n){var v=c[i]*s;return v%2?v+1:v}}return 10*s}
function dayVal(d,m){var a=S.stats.daily[d]||{},b=T.daily[d]||{};return (a[m]||0)+(b[m]||0)}
function lastDays(){var out=[];for(var i=13;i>=0;i--){var d=new Date();d.setDate(d.getDate()-i);out.push(ymd(d))}return out}
function roundTop(x,y,w,h,r){r=Math.min(4,h,w/2);return 'M'+x+','+(y+h)+' V'+(y+r)+' Q'+x+','+y+' '+(x+r)+','+y+' H'+(x+w-r)+' Q'+(x+w)+','+y+' '+(x+w)+','+(y+r)+' V'+(y+h)+' Z'}
function chart(m){
  var days=lastDays(),vals=days.map(function(d){return dayVal(d,m)}),mx=nice(Math.max(4,Math.max.apply(null,vals)));
  var W=640,H=232,L=38,R=6,Tp=12,B=28,pw=W-L-R,ph=H-Tp-B,bw=pw/days.length,w=Math.min(26,bw*.6),noun=m==='v'?'views':'appreciations';
  var s='<svg class="cv" viewBox="0 0 '+W+' '+H+'" role="img" aria-label="Daily '+noun+' for the last 14 days">';
  [0,mx/2,mx].forEach(function(t){var y=Tp+ph-t/mx*ph;s+='<line class="grid" x1="'+L+'" x2="'+(W-R)+'" y1="'+y+'" y2="'+y+'"/><text x="'+(L-8)+'" y="'+(y+4)+'" text-anchor="end">'+fmt(t)+'</text>'});
  days.forEach(function(d,i){
    var h=vals[i]/mx*ph,x=L+i*bw+(bw-w)/2,y=Tp+ph-h,last=i===days.length-1;
    s+='<rect class="hit" x="'+(L+i*bw)+'" y="'+Tp+'" width="'+bw+'" height="'+ph+'" data-tip="'+dayLabel(d)+' · '+vals[i]+' '+noun+'"/>';
    if(h>0)s+='<path class="bar'+(last?'':' old')+'" d="'+roundTop(x,y,w,h)+'" pointer-events="none"/>';
    if(i%3===1)s+='<text x="'+(x+w/2)+'" y="'+(H-8)+'" text-anchor="middle">'+dayLabel(d)+'</text>';
  });
  return s+'</svg>';
}
function chartTable(m){
  var days=lastDays();
  return '<div class="scrollx"><table class="tbl"><thead><tr><th>Day</th><th>'+(m==='v'?'Views':'Appreciations')+'</th></tr></thead><tbody>'+days.slice().reverse().map(function(d){return '<tr><td>'+dayLabel(d)+'</td><td>'+dayVal(d,m)+'</td></tr>'}).join('')+'</tbody></table></div>';
}

var curHash=location.hash||'';
function parse(){
  var h=curHash.replace(/^#/,''),m;
  if(!h||h==='portfolio')return {n:'home'};
  if((m=/^work-([a-z0-9]+)$/.exec(h)))return {n:'work',id:m[1]};
  if((m=/^dash-edit-([a-z0-9]+)$/.exec(h)))return {n:'edit',id:m[1]};
  if(/^dash-(overview|projects|profile|look|data)$/.test(h))return {n:h.slice(5)};
  return {n:'home'};
}
var lastKey=null;
function go(h){
  h=String(h||'').replace(/^#/,'');curHash=h?'#'+h:'';
  try{if(location.hash!==curHash)location.hash=h}catch(e){}
  onRoute();
}
function render(keep){
  var y=window.scrollY,r=parse(),html;
  applyLook();
  try{
    if(r.n==='home')html=homeView();else if(r.n==='work')html=workView(r.id);else html=dashShell(r);
  }catch(err){
    html='<main class="wrap" style="padding-block:60px;max-width:640px"><h1 style="font-size:28px">This page hit a problem</h1><p style="margin:12px 0 20px;color:var(--muted)">The saved data in this browser looks damaged ('+esc(err&&err.message||err)+'). Reset to the built-in version to get going again. Your exported backups are not affected.</p><div class="row"><button class="btn primary" data-act="reset-now">Reset saved data</button><a class="btn" href="#portfolio">Try the site</a></div></main>';
  }
  $('#app').innerHTML=html;hydrate($('#app'));
  var p=r.n==='work'||r.n==='edit'?proj(r.id):null;
  document.title=(r.n==='home'?S.profile.name:r.n==='work'&&p?p.title+' | '+S.profile.name:'Studio | '+S.profile.name);
  if(keep)window.scrollTo(0,y);
  if(ui.focus){var f=document.getElementById(ui.focus);if(f){f.focus()}ui.focus=null}
}
function onRoute(){
  lastKey=curHash;
  var r=parse();
  if(r.n==='work'){
    var p=proj(r.id);
    if(p&&p.status==='published'&&!ui.skipView){
      var seen=false;try{seen=sessionStorage.getItem('ps-seen-'+p.id)}catch(e){}
      if(!seen){
        try{sessionStorage.setItem('ps-seen-'+p.id,'1')}catch(e){}
        var d=ymd(new Date());T.pv[p.id]=(T.pv[p.id]||0)+1;(T.daily[d]=T.daily[d]||{v:0,l:0}).v++;saveStats();
      }
    }
  }
  ui.skipView=false;
  if(r.n!=='home'&&r.n!=='work'){try{sessionStorage.setItem('ps-owner','1')}catch(e){}}
  render(false);
  if(ui.pendingScroll){var t=ui.pendingScroll;ui.pendingScroll=null;scrollToId(t)}else window.scrollTo(0,0);
}
function scrollToId(id){var el=document.getElementById(id);if(el){var reduce=window.matchMedia('(prefers-reduced-motion: reduce)').matches;el.scrollIntoView({behavior:reduce?'auto':'smooth',block:'start'})}}

/* ---------- actions ---------- */
function confirmBox(title,msg,label,fn){
  window.__confirm=fn;
  $('#modal').innerHTML='<div class="modal" data-act="modal-cancel"><div class="mbox" role="dialog" aria-modal="true" aria-label="'+esc(title)+'"><h2>'+esc(title)+'</h2><p>'+esc(msg)+'</p><div class="row" style="justify-content:flex-end"><button class="btn" data-act="modal-cancel">Cancel</button><button class="btn primary" data-act="modal-ok">'+esc(label)+'</button></div></div></div>';
}
function closeModal(){$('#modal').innerHTML='';window.__confirm=null}
function newProject(){
  var p={id:uid(),title:'Untitled project',desc:'',tags:[],tools:[],year:String(new Date().getFullYear()),client:'',url:'',cover:'',status:'draft',featured:false,likes:0,views:0,blocks:[],created:Date.now(),updated:Date.now()};
  S.projects.unshift(p);save();go('dash-edit-'+p.id);
}
var pickFn=null;
function openPicker(accept,multiple,fn){pickFn=fn;var f=$('#fileIn');f.accept=accept;f.multiple=!!multiple;f.value='';f.click()}
function addFiles(pid,files){
  var p=proj(pid);if(!p)return Promise.resolve();
  var chain=Promise.resolve(),added=0,skipped=0;
  files.forEach(function(f){
    var k=kindOf(f);if(!k){skipped++;return}
    chain=chain.then(function(){return storeFile(f)}).then(function(ref){
      p.blocks.push({id:uid(),type:k,src:ref,name:f.name,caption:'',fit:'full'});added++;
      if(!p.cover&&k!=='video')p.cover=ref;
    });
  });
  return chain.then(function(){p.updated=Date.now();save();render(true);toast(added?added+' file'+(added===1?'':'s')+' added'+(skipped?', '+skipped+' skipped (unsupported type)':''):'Those files are not images, GIFs or videos.')});
}
function getArr(d){if(d.scope==='project')return (proj(d.id)||{})[d.f];if(d.scope==='sg'){var g=S.profile.skillGroups[+d.id];return g?g.items:null}return S.profile[d.f]}
function exportState(inline){
  var st=JSON.parse(JSON.stringify(S));
  if(!inline)return Promise.resolve(st);
  var conv=function(ref){return ref&&ref.indexOf('idb:')===0?media.blob(ref).then(function(b){return b?readDataURL(b):''}):Promise.resolve(ref)};
  var jobs=[];
  jobs.push(conv(st.profile.avatar).then(function(v){st.profile.avatar=v}));
  st.projects.forEach(function(p){jobs.push(conv(p.cover).then(function(v){p.cover=v}));p.blocks.forEach(function(b){if(b.src)jobs.push(conv(b.src).then(function(v){b.src=v}))})});
  return Promise.all(jobs).then(function(){return st});
}
function adopt(o){
  if(!o||!o.profile)throw new Error('This is not a Portfolio Studio backup.');
  S=norm(o);S.edited=true;
  return migrate().then(function(){S.saved=Date.now();tset(KEY,JSON.stringify(S));saveMsg='Saved to this browser';render(true)});
}
var ACT={
  theme:function(){S.look.theme=isDark()?'light':'dark';save();render(true)},
  scroll:function(el){var to=el.dataset.to;if(parse().n!=='home'){ui.pendingScroll=to;go('portfolio')}else scrollToId(to)},
  'filter-tag':function(el){ui.tag=el.dataset.tag||null;render(true)},
  like:function(el){
    var id=el.dataset.id,i=liked.indexOf(id),d=ymd(new Date()),day=(T.daily[d]=T.daily[d]||{v:0,l:0});
    if(i<0){liked.push(id);T.pl[id]=(T.pl[id]||0)+1;day.l++}else{liked.splice(i,1);T.pl[id]=(T.pl[id]||0)-1;day.l=Math.max(0,day.l-1)}
    saveStats();render(true);
  },
  lightbox:function(el){var src=el.currentSrc||el.src;if(!src)return;$('#lb').innerHTML='<div class="lb" data-act="lb-close"><img src="'+esc(src)+'" alt="'+esc(el.alt||'')+'"></div>'},
  'lb-close':function(){$('#lb').innerHTML=''},
  copy:function(el){copyText(el.dataset.text)},
  'new-project':newProject,
  view:function(el){ui.skipView=true;try{sessionStorage.setItem('ps-owner','1')}catch(e){}go('work-'+el.dataset.id)},
  status:function(el){
    var p=proj(el.dataset.id);if(!p)return;
    if(p.status!=='published'){
      if(!p.title.trim()){toast('Give the project a title first.');return}
      if(!p.cover){var f=p.blocks.filter(function(b){return (b.type==='image'||b.type==='gif')&&b.src})[0];if(f)p.cover=f.src;else{toast('Add a cover image before publishing.');return}}
      p.status='published';toast('Published. It is now on your home page.');
    }else{p.status='draft';toast('Moved back to drafts.')}
    p.updated=Date.now();save();render(true);
  },
  feature:function(el){var p=proj(el.dataset.id);if(p){p.featured=!p.featured;save();render(true)}},
  dup:function(el){
    var p=proj(el.dataset.id);if(!p)return;var c=JSON.parse(JSON.stringify(p));
    c.id=uid();c.title=p.title+' (copy)';c.status='draft';c.featured=false;c.sample=false;c.views=0;c.likes=0;c.created=Date.now();c.blocks.forEach(function(b){b.id=uid()});
    S.projects.unshift(c);save();render(true);toast('Duplicated as a draft.');
  },
  del:function(el){
    var id=el.dataset.id,p=proj(id);if(!p)return;
    confirmBox('Delete this project?','"'+p.title+'" will be removed from your site. This cannot be undone.','Delete',function(){S.projects=S.projects.filter(function(x){return x.id!==id});save();if(parse().n==='edit')go('dash-projects');else render(true);toast('Project deleted.')});
  },
  'add-block':function(el){
    var p=proj(el.dataset.id),t=el.dataset.t;if(!p)return;
    var b={id:uid(),type:t,src:'',caption:'',fit:'full',text:''};p.blocks.push(b);save();ui.focus=null;render(true);
  },
  mv:function(el){var p=proj(el.dataset.id);if(!p)return;var i=p.blocks.findIndex(function(b){return b.id===el.dataset.b}),j=i+Number(el.dataset.d);if(i<0||j<0||j>=p.blocks.length)return;var t=p.blocks[i];p.blocks[i]=p.blocks[j];p.blocks[j]=t;save();render(true)},
  'rm-block':function(el){var p=proj(el.dataset.id);if(!p)return;p.blocks=p.blocks.filter(function(b){return b.id!==el.dataset.b});save();render(true)},
  pick:function(el){
    var pid=el.dataset.id,bid=el.dataset.b;
    openPicker('image/*,video/*',false,function(files){
      var f=files[0],k=kindOf(f),b=blk(pid,bid);
      if(!k||!b){toast('Choose an image, GIF or video file.');return Promise.resolve()}
      return storeFile(f).then(function(ref){b.src=ref;b.name=f.name;b.type=k;save();render(true)});
    });
  },
  'pick-many':function(el){var pid=el.dataset.id;openPicker('image/*,video/*',true,function(files){return addFiles(pid,files)})},
  'cover-up':function(el){var pid=el.dataset.id;openPicker('image/*',false,function(files){var p=proj(pid);if(!p||!kindOf(files[0])||kindOf(files[0])==='video'){toast('Choose an image or GIF.');return Promise.resolve()}return storeFile(files[0]).then(function(ref){p.cover=ref;save();render(true)})})},
  'cover-first':function(el){var p=proj(el.dataset.id);if(!p)return;var f=p.blocks.filter(function(b){return (b.type==='image'||b.type==='gif')&&b.src})[0];if(f){p.cover=f.src;save();render(true)}else toast('Add an image block first.')},
  'cover-clear':function(el){var p=proj(el.dataset.id);if(p){p.cover='';save();render(true)}},
  'rm-tag':function(el){var d=el.dataset,a=getArr(d);if(a){a.splice(+d.i,1);save();render(true)}},
  'add-link':function(){S.profile.links.push({label:'',url:''});save();render(true)},
  'del-link':function(el){S.profile.links.splice(+el.dataset.i,1);save();render(true)},
  'add-exp':function(){S.profile.experience.push({role:'',org:'',period:'',desc:''});save();render(true)},
  'del-exp':function(el){S.profile.experience.splice(+el.dataset.i,1);save();render(true)},
  'add-edu':function(){S.profile.education.push({role:'',org:'',period:''});save();render(true)},
  'del-edu':function(el){S.profile.education.splice(+el.dataset.i,1);save();render(true)},
  'add-sg':function(){S.profile.skillGroups.push({title:'New group',items:[]});save();render(true)},
  'del-sg':function(el){S.profile.skillGroups.splice(+el.dataset.i,1);save();render(true)},
  'avatar-up':function(){openPicker('image/*',false,function(files){if(kindOf(files[0])!=='image'&&kindOf(files[0])!=='gif'){toast('Choose an image file.');return Promise.resolve()}return storeFile(files[0]).then(function(ref){S.profile.avatar=ref;save();render(true)})})},
  'avatar-clear':function(){S.profile.avatar='';save();render(true)},
  look:function(el){var k=el.dataset.k,v=el.dataset.v;S.look[k]=k==='cols'?Number(v):v;save();render(true)},
  metric:function(el){ui.metric=el.dataset.v;render(true)},
  'table-toggle':function(){ui.table=!ui.table;render(true)},
  pfilter:function(el){ui.filter=el.dataset.v;render(true)},
  'clear-demo':function(){S.stats={demo:false,daily:{}};S.projects.forEach(function(p){if(p.sample){p.views=0;p.likes=0}});save();render(true);toast('Sample numbers cleared. Real counts start now.')},
  'export-json':function(){exportState(true).then(function(st){saveFile('portfolio-backup.json',JSON.stringify(st),'application/json')})},
  'copy-json':function(){exportState(true).then(function(st){copyText(JSON.stringify(st),'Backup copied. Paste it into a text file to keep it.')})},
  'import-file':function(){openPicker('.json,application/json',false,function(files){return files[0].text().then(function(t){return adopt(JSON.parse(t))}).then(function(){toast('Backup imported.')}).catch(function(e){toast(e.message||'That file could not be read.')})})},
  'import-paste':function(){var t=($('#importText')||{}).value||'';if(!t.trim()){toast('Paste your backup text first.');return}try{adopt(JSON.parse(t)).then(function(){toast('Backup imported.')})}catch(e){toast('That text is not valid backup JSON.')}},
  'export-site':function(){
    exportState(true).then(function(st){
      st.projects=st.projects.filter(function(p){return p.status==='published'});st.saved=Date.now();st.stats={demo:false,daily:{}};
      var json=JSON.stringify(st).replace(/</g,'\\u003c');
      var re=/(<script type="application\/json" id="seed">)[\s\S]*?(<\/script>)/;
      saveFile('index.html',SRC_HTML.replace(re,function(m,a,b){return a+json+b}),'text/html');
    });
  },
  'clear-sample':function(){confirmBox('Delete sample projects?','The five example projects will be removed. Your own projects stay.','Delete samples',function(){S.projects=S.projects.filter(function(p){return !p.sample});S.stats={demo:false,daily:{}};save();render(true);toast('Sample projects removed.')})},
  'reset-now':function(){try{localStorage.removeItem(KEY)}catch(e){}S=load();saveMsg='';go('portfolio')},
  'reset-local':function(){confirmBox('Discard changes?','This removes the copy saved in this browser and reloads the version built into the file.','Discard',function(){try{localStorage.removeItem(KEY)}catch(e){}S=load();saveMsg='';render(true);toast('Back to the built-in version.')})},
  'clear-all':function(){confirmBox('Start from empty?','All projects and profile text are removed from this browser. Download a backup first if you might want them back.','Start empty',function(){var e=sample();e.projects=[];e.stats={demo:false,daily:{}};e.profile=blankProfile();e.profile.avatar='';S=norm(e);save();render(true);toast('Empty portfolio ready.')})},
  'modal-ok':function(){var f=window.__confirm;closeModal();if(f)f()},
  'modal-cancel':function(el,e){if(el.classList.contains('modal')&&e.target!==el)return;closeModal()}
};
document.addEventListener('click',function(e){
  var el=e.target.closest('[data-act]');if(!el)return;
  var a=el.dataset.act;
  if(a==='modal-cancel'&&el.classList.contains('modal')&&e.target!==el)return;
  if(a==='lb-close'||ACT[a]){if(ACT[a])ACT[a](el,e)}
});
document.addEventListener('input',function(e){
  var t=e.target,d=t.dataset;if(!d)return;
  if(d.ui==='q'){ui.q=t.value;$('#pgrid').innerHTML=projCards();hydrate($('#pgrid'));return}
  if(d.scope&&d.f&&!d.re)applyField(t);
});
document.addEventListener('change',function(e){
  var t=e.target,d=t.dataset;if(!d)return;
  if(d.ui==='sort'){ui.sort=t.value;render(true);return}
  if(d.scope&&d.f&&d.re){applyField(t);render(true)}
});
document.addEventListener('keydown',function(e){
  var t=e.target;
  if(t.dataset&&t.dataset.tagin!==undefined&&(e.key==='Enter'||e.key===',')){
    e.preventDefault();var v=t.value.trim().replace(/,$/,'');if(!v)return;
    var arr=getArr(t.dataset);if(arr&&arr.indexOf(v)<0)arr.push(v);ui.focus=t.id;save();render(true);return;
  }
  if(e.key==='Escape'){$('#lb').innerHTML='';closeModal()}
});
$('#fileIn').addEventListener('change',function(e){
  var files=Array.prototype.slice.call(e.target.files),fn=pickFn;pickFn=null;
  if(fn&&files.length){var r=fn(files);if(r&&r.catch)r.catch(function(){toast('That file could not be added.')})}
});
['dragenter','dragover'].forEach(function(n){document.addEventListener(n,function(e){var z=e.target.closest&&e.target.closest('[data-drop]');if(z){e.preventDefault();z.classList.add('over')}})});
['dragleave','drop'].forEach(function(n){document.addEventListener(n,function(e){var z=e.target.closest&&e.target.closest('[data-drop]');if(z){e.preventDefault();z.classList.remove('over');if(n==='drop'&&e.dataTransfer&&e.dataTransfer.files.length)addFiles(z.dataset.drop,Array.prototype.slice.call(e.dataTransfer.files))}})});
document.addEventListener('mouseover',function(e){
  var el=e.target.closest&&e.target.closest('[data-tip]'),tip=$('#tip');
  if(!el){tip.hidden=true;return}
  tip.textContent=el.getAttribute('data-tip');tip.hidden=false;
  var b=el.getBoundingClientRect(),w=tip.offsetWidth;
  tip.style.left=Math.max(8,Math.min(window.innerWidth-w-8,b.left+b.width/2-w/2))+'px';tip.style.top=Math.max(8,b.top-34)+'px';
});
window.addEventListener('hashchange',function(){curHash=location.hash||'';if(curHash!==lastKey)onRoute()});
window.addEventListener('click',function(e){
  var a=e.target&&e.target.closest&&e.target.closest('a[href^="#"]');
  if(!a||e.button||e.metaKey||e.ctrlKey||e.shiftKey)return;
  e.preventDefault();e.stopPropagation();go(a.getAttribute('href'));
},true);

/* ---------- start ---------- */
applyLook();
if(!S.edited)saveMsg='';
render(false);
if(curHash.length>1&&parse().n!=='home'){onRoute()}else lastKey=curHash;
})();
</script>
